[package]
name = "fiction-island"
version = "0.1.0"
description = "Fiction Orchestra — Mac cockpit (live writers'-room board + notifications + ops)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
objc2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
